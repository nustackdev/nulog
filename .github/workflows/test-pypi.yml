name: Test PyPI Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to test (e.g., 0.1.1). Leave empty for latest.'
        required: false
        default: ''

jobs:
  smoke_test:
    name: Smoke test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install nulog from PyPI
        run: |
          python -m pip install --upgrade pip
          if [ -z "${{ inputs.version }}" ]; then
            pip install nulog
          else
            pip install nulog==${{ inputs.version }}
          fi

      - name: Show installed version
        run: pip show nulog

      - name: Smoke test - imports
        run: |
          python << 'EOF'
          import nulog
          print(f"  nulog ok: {nulog}")
          print("All smoke tests passed!")
          EOF
